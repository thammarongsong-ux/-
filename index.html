  border:3px solid var(--ink);
  border-radius:999px;
  box-shadow:4px 4px 0 var(--ink);
  font-weight:800;
  transition:.15s;
  min-height:48px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}

.btn:active{
  transform:translate(3px,3px) scale(.97);
  box-shadow:1px 1px 0 var(--ink);
}

  background:linear-gradient(135deg,#FF5D8F,#FF8A3D 45%,#FFC531);

}

  background:var(--yellow-soft) !important;
}

  border:2.5px solid var(--ink);
  border-radius:999px;
  font-weight:800;
}

.pop{
  animation:pop .35s ease both;
}

@keyframes pop{
  from{
    transform:scale(.85);
    opacity:.4
  }

  to{
    transform:scale(1);
    opacity:1
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0) rotate(-2deg)
  }

  50%{
    transform:translateY(-10px) rotate(2deg)
  }
}

.floaty{
  animation:floaty 3.2s ease-in-out infinite;
}

@keyframes wiggle{
  0%,100%{
    transform:rotate(0)
  }

  25%{
    transform:rotate(-3deg)
  }

  75%{
    transform:rotate(3deg)
  }
}

.wiggle{
  animation:wiggle .4s ease;
}

@keyframes shake{
  0%,100%{
    transform:translateX(0)
  }

  20%{
    transform:translateX(-7px)
  }

  40%{
    transform:translateX(6px)
  }

  60%{
    transform:translateX(-4px)
  }

  80%{
    transform:translateX(3px)
  }
}

.shake{
  animation:shake .45s ease;
}

@keyframes fall{
  0%{
    transform:translateY(-30px) rotate(0deg);
    opacity:1
  }

  100%{
    transform:translateY(105vh) rotate(260deg);
    opacity:.1
  }
}

.confetti-piece{
  position:fixed;
  top:-30px;
  z-index:70;
  animation:fall 1.8s ease-in forwards;
  pointer-events:none;
  font-size:26px;
}

@keyframes bounceSoft{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-8px)
  }
}

.bounce-soft{
  animation:bounceSoft 1.6s ease-in-out infinite;
}

@keyframes confetti{
  0%{
    transform:translateY(0) scale(1);
    opacity:1
  }

  100%{
    transform:translateY(22px) scale(.8);
    opacity:.5
  }
}

.confetti{
  animation:confetti .8s ease infinite alternate;
}

@keyframes slideIn{
  from{

}

.slide-in{

/* ===== THEME 2026 : ตัวหนังสือคมชัด + เมนูสีสดใส ===== */
:root{
  --cream:#FFFBF3; --surface:#FFFFFF;
  --ink:#16233D; --muted:#4C5872; --line:#16233D;
  --pink:#D91E68; --pink-soft:#FFE1EC;
  --blue:#1478C8; --blue-soft:#DBEEFF;
  --yellow:#FFC02E; --yellow-soft:#FFF0BC;
  --green:#0B8043; --green-soft:#D3F6E0;
  --purple:#6D3DE0; --purple-soft:#E8E1FF;
  --orange:#FF7A2F;
  color-scheme:light;
}
html{scroll-padding-top:96px;}
body{
  background-color:#FFFBF3;
  background-image:
    radial-gradient(900px 520px at 6% -8%, #FFE2EF 0%, rgba(255,226,239,0) 60%),
    radial-gradient(820px 520px at 102% 2%, #D9EDFF 0%, rgba(217,237,255,0) 58%),
    radial-gradient(760px 560px at 48% 106%, #E9E2FF 0%, rgba(233,226,255,0) 62%),
    linear-gradient(180deg,#FFFCF4 0%,#FFF4E3 40%,#EFF8FF 74%,#FBF2FF 100%);
  background-attachment:fixed;
  color:var(--ink);
  text-shadow:0 1px 0 rgba(255,255,255,.85);
}
h1,h2,h3,h4,.font-display{
  text-shadow:0 1px 0 #fff, 0 2px 0 rgba(22,35,61,.12), 0 10px 22px rgba(22,35,61,.10);
}
strong,b{text-shadow:0 1px 0 rgba(255,255,255,.9);}
::selection{background:#FFD3E4;color:#16233D;}

/* หัวเว็บ + แถบเมนู */
header[class*="bg-white"]{
  background-color:#fff;
  background-image:linear-gradient(115deg,#FFFAEF 0%,#FFE8F3 36%,#E2F2FF 70%,#F2ECFF 100%);
  border-bottom-color:var(--ink);
  box-shadow:0 8px 26px rgba(22,35,61,.12);
}
header div[class*="bg-[var(--yellow-soft)]"]{
  background-image:linear-gradient(110deg,#FFF3C6,#FFE6F0 55%,#E4F2FF);
}
header .chip{box-shadow:0 2px 0 rgba(22,35,61,.32);}

/* เมนูหลัก : ปกติเป็นสีพาสเทลสลับสี / ปุ่มที่เลือกเป็นสีสดเข้มอ่านชัด */
header nav[aria-label="เมนูหลัก"]>button{
  background-image:linear-gradient(150deg,#fff,#FFF7E8);
  border-color:rgba(22,35,61,.5);
  box-shadow:0 3px 0 rgba(22,35,61,.32), 0 6px 14px rgba(22,35,61,.10);
  text-shadow:0 1px 0 rgba(255,255,255,.9);
}
header nav[aria-label="เมนูหลัก"]>button:nth-child(6n+1){background-image:linear-gradient(150deg,#FFE3EE,#FFD0E2);}
header nav[aria-label="เมนูหลัก"]>button:nth-child(6n+2){background-image:linear-gradient(150deg,#DBEEFF,#C7E5FF);}
header nav[aria-label="เมนูหลัก"]>button:nth-child(6n+3){background-image:linear-gradient(150deg,#D3F6E0,#BDF0D2);}
header nav[aria-label="เมนูหลัก"]>button:nth-child(6n+4){background-image:linear-gradient(150deg,#FFF0BC,#FFE79A);}
header nav[aria-label="เมนูหลัก"]>button:nth-child(6n+5){background-image:linear-gradient(150deg,#E8E1FF,#DCD2FF);}
header nav[aria-label="เมนูหลัก"]>button:nth-child(6n+6){background-image:linear-gradient(150deg,#FFE7D6,#FFD9BE);}
header nav[aria-label="เมนูหลัก"]>button[class*="text-white"]{
  color:#fff;
  background-image:linear-gradient(135deg,#D91E68 0%,#C2410C 100%);
  border-color:var(--ink);
  box-shadow:0 3px 0 var(--ink), 0 10px 18px rgba(232,46,119,.32);
  text-shadow:0 1px 3px rgba(60,8,30,.55), 0 1px 1px rgba(0,0,0,.4);
}
header nav:not([aria-label])>button{
  color:var(--ink);
  background-image:linear-gradient(150deg,#fff,#FFF6E6);
}
header nav:not([aria-label])>button[class*="text-white"]{
  color:#fff;
  background-image:linear-gradient(135deg,#D91E68,#C2410C);
  box-shadow:0 3px 0 var(--ink);
}

/* ปุ่ม */
.btn{
  box-shadow:0 4px 0 var(--ink), 0 10px 18px rgba(22,35,61,.14);
  text-shadow:0 1px 0 rgba(255,255,255,.75);
}
.btn:active{transform:translate(0,3px) scale(.98);box-shadow:0 1px 0 var(--ink);}
.btn:focus-visible{outline:3px solid var(--purple);outline-offset:3px;}
.btn[class*="text-white"]{text-shadow:0 1px 3px rgba(0,0,0,.45), 0 1px 1px rgba(0,0,0,.35);}
.btn.bg-white{background-color:#fff;background-image:linear-gradient(160deg,#fff,#FFF9EC);color:var(--ink);}
@media (hover:hover){
  .btn:hover:not(:active){transform:translateY(-2px);box-shadow:0 6px 0 var(--ink), 0 14px 22px rgba(22,35,61,.18);}
}

/* การ์ด + ชิป */
.card{
  background-color:#fff;
  background-image:linear-gradient(180deg,#fff 0%,#FFFDF7 100%);
  box-shadow:0 12px 28px rgba(22,35,61,.13), 0 6px 0 var(--ink);
}
.chip:not([class*="bg-"]){
  background-image:linear-gradient(140deg,#fff,#FFF6E4);
  box-shadow:0 2px 0 rgba(22,35,61,.32);
  text-shadow:0 1px 0 rgba(255,255,255,.9);
}
.chip:not([class*="text-white"]){color:var(--ink);}
.chip[class*="text-white"]{text-shadow:0 1px 2px rgba(0,0,0,.4);}

/* ฟอร์ม */
input,textarea,select{color:var(--ink);background-color:#fff;text-shadow:none;}
input::placeholder,textarea::placeholder{color:#8C94A8;opacity:1;}

/* ข้อความสีขาวบนพื้นสี */
.text-white,[class*="btn-gradient"]{text-shadow:0 1px 3px rgba(0,0,0,.45), 0 1px 1px rgba(0,0,0,.3);}
/* ปุ่มไล่สี : ใช้ตัวอักษรสีเข้มคมชัดสูงสุด */
.btn.btn-gradient{color:#16233D;text-shadow:0 1px 0 rgba(255,255,255,.6);}
.btn.btn-gradient-blue{background-image:linear-gradient(135deg,#1478C8,#6D3DE0);}
</style>

  <script>
/* ---- Save layer: real Google Sheet saving + local persistence ---- */
(function () {
  var KEY = "slr_save_v2";
  var DEFAULTS = {
    sheetId: "1kdcfefZOt8Tl8n2P9xvlr6Qmgdrh6dmuPyYB2SLheow",
    scriptUrl: "https://script.google.com/macros/s/AKfycbzXaar2hHK0HYdghwx8L8admcbg6R_Eyhl9Kx-0P4-YhysLC9YcFDjHeMnJrR83Gsv1yw/exec",
    sheetName: "ผลสอบ", teacher: "", grade: "ป.2", room: "",
    voiceName: "", rate: 0.85, font: "sarabun", soundOn: true
  };
  function read() { try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { return {}; } }
  var db = read();
  function write(patch) {
    db = Object.assign(read(), patch);
    try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
  }
  function cfg() { return Object.assign({}, DEFAULTS, db.cfg || {}); }
  function saveCfg(c) { write({ cfg: c }); }
  function queue() {
    var q = Array.isArray(db.queue) ? db.queue : [];
    return q.map(function (r) {
      return r.status === "sending" ? Object.assign({}, r, { status: "queued" }) : r;
    }).slice(-200);
  }
  function saveQueue(q) { write({ queue: Array.isArray(q) ? q.slice(-200) : [] }); }
  function state() {
    return Object.assign({ name: "", pre: null, post: null, lessons: [false, false, false], stars: [0, 0, 0, 0, 0, 0] }, db.state || {});
  }
  function saveState(s) { write({ state: s }); }
  function voiceScore(v) {
    var n = String(v.name || "").toLowerCase(), s = 50;
    if (/google/.test(n)) s = 100;
    if (/premwadee|niwat|kanya|achara|neural|natural|premium/.test(n)) s = 95;
    if (/thai|ไทย/.test(n)) s += 8;
    return v.localService === false ? s + 6 : s + 2;
  }
  function pickVoice(list, pref) {
    var arr = (list || []).filter(function (v) {
      return String(v.lang || "").toLowerCase().indexOf("th") === 0 || /thai|ไทย/i.test(v.name || "");
    });
    if (pref) {
      var hit = arr.filter(function (v) { return v.name === pref; })[0];
      if (hit) return hit;
    }
    arr.sort(function (a, b) { return voiceScore(b) - voiceScore(a); });
    return arr[0] || null;
  }
  function strip(html) {
    return String(html || "")
      .replace(/<script[\s\S]*?<\/script>/gi, " ")
      .replace(/<style[\s\S]*?<\/style>/gi, " ")
      .replace(/<[^>]+>/g, " ")
      .replace(/\s+/g, " ").trim();
  }
  function payload(rows, opt) {
    var c = cfg();
    return {
      sheet: String((opt && opt.sheetName) || c.sheetName || "ผลสอบ"),
      rows: (rows || []).map(function (r) {
        return {
          time: r.time || "", name: r.name || "", grade: r.grade || "", room: r.room || "",
          type: r.type || "", total: Number(r.total) || 0, score: Number(r.score) || 0,
          pct: Number(r.pct) || 0, level: r.level || "", device: r.device || ""
        };
      })
    };
  }
  function post(rows, opt) {
    var c = cfg(), url = String((opt && opt.scriptUrl) || c.scriptUrl || "").trim();
    if (!url) return Promise.resolve({ ok: false, error: "ยังไม่ได้ใส่ Apps Script Web App URL" });
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, 25000) : null;
    return fetch(url, {
      method: "POST", redirect: "follow", cache: "no-store", credentials: "omit",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload(rows, opt)),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) {
      return res.text().then(function (txt) {
        var data = null;
        try { data = JSON.parse(txt); } catch (e) {}
        if (data && data.ok === true) return { ok: true, added: data.added || rows.length };
        if (data && data.ok === false) return { ok: false, error: String(data.error || "สคริปต์แจ้งว่าบันทึกไม่สำเร็จ") };
        if (/^\s*ok\s*$/i.test(txt)) return { ok: true, added: rows.length };
        var t = strip(txt);
        if (/Script function not found/i.test(t)) return { ok: false, error: "Apps Script ยังไม่มีฟังก์ชัน doPost — วางโค้ด Code.gs แล้ว Deploy ใหม่" };
        if (/Authorization|ต้องได้รับอนุญาต|Sign in|เข้าสู่ระบบ/i.test(t)) return { ok: false, error: "Apps Script ยังไม่ได้รับสิทธิ์เข้าถึงชีต หรือตั้งสิทธิ์ไม่ใช่ \"ทุกคน\"" };
        return { ok: false, error: "ปลายทางตอบกลับผิดรูปแบบ (HTTP " + res.status + ") " + t.slice(0, 120) };
      });
    }).catch(function (err) {
      var msg = String((err && err.message) || err);
      if (/abort/i.test(msg)) msg = "หมดเวลาเชื่อมต่อ (25 วินาที) — ตรวจอินเทอร์เน็ตหรือ URL";
      return { ok: false, error: msg };
    }).then(function (r) { if (timer) clearTimeout(timer); return r; });
  }
  window.SLRS = {
    cfg: cfg, saveCfg: saveCfg, queue: queue, saveQueue: saveQueue, state: state,
    saveState: saveState, pickVoice: pickVoice, post: post, defaults: DEFAULTS
  };
})();
